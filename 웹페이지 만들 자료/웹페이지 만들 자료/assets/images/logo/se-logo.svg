<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none" class="se-logo-svg">
  <defs>
    <linearGradient id="seGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #0c2340)" />
      <stop offset="100%" stop-color="var(--color-primary-light, #1d4ed8)" />
    </linearGradient>
  </defs>
  <!-- SE Monogram Badge -->
  <g class="se-symbol" transform="translate(4, 5)">
    <rect width="40" height="40" rx="10" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5" class="symbol-bg"/>
    <!-- S Path -->
    <path d="M 17 16 C 14 16 12 17.5 12 19.5 C 12 22 15 22.5 17 23.5 C 19 24.5 19.5 26 19.5 27.5 C 19.5 30 16.5 31.5 13.5 31.5 C 11.5 31.5 10 30.5 9.5 29.5" 
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none" class="symbol-stroke"/>
    <!-- E Path -->
    <path d="M 23 16.5 L 29 16.5 M 23 16.5 L 23 31.5 M 23 24 L 27.5 24 M 23 31.5 L 29 31.5" 
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" class="symbol-stroke"/>
  </g>
  <!-- SEOHYUN EOM Typography -->
  <g transform="translate(56, 17)">
    <text x="0" y="10" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="15" font-weight="800" letter-spacing="2.5" fill="currentColor" class="logo-title">SEOHYUN EOM</text>
    <text x="1" y="24" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" font-weight="500" letter-spacing="1.2" fill="currentColor" fill-opacity="0.6" class="logo-sub">FOOD &amp; NUTRITION</text>
  </g>
</svg>
